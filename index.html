<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Pac-Man Configurable</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0a0a14;
    color: #fff;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 20px;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  .app {
    display: grid;
    grid-template-columns: 280px 800px;
    gap: 20px;
    align-items: start;
    width: 100%;
    max-width: 1100px;
  }
  .panel {
    background: #1a1a2e;
    border: 2px solid #2d2d52;
    border-radius: 10px;
    padding: 18px;
  }
  .panel h2 {
    margin: 0 0 14px 0;
    color: #ffd700;
    font-size: 18px;
    border-bottom: 1px solid #2d2d52;
    padding-bottom: 8px;
  }
  .panel h3 {
    margin: 14px 0 8px 0;
    color: #b8c1ec;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .control {
    margin-bottom: 14px;
  }
  .control.hidden { display: none; }
  .control label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 6px;
    color: #b8c1ec;
  }
  .control label .val {
    color: #ffd700;
    font-weight: bold;
  }
  .control input[type=range] {
    width: 100%;
    accent-color: #ffd700;
  }
  .control select {
    width: 100%;
    background: #0f0f1f;
    color: #fff;
    border: 1px solid #2d2d52;
    border-radius: 5px;
    padding: 6px;
    font-size: 13px;
  }
  .toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #b8c1ec;
    cursor: pointer;
  }
  .toggle input { accent-color: #ffd700; width: 16px; height: 16px; }
  .buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
  }
  .buttons button {
    padding: 10px;
    border-radius: 6px;
    border: none;
    font-weight: bold;
    cursor: pointer;
    background: #2d2d52;
    color: #fff;
    transition: background 0.15s;
  }
  .buttons button.primary {
    background: #ffd700;
    color: #000;
    grid-column: 1 / -1;
  }
  .buttons button.full { grid-column: 1 / -1; }
  .buttons button:hover { filter: brightness(1.15); }
  .buttons button:disabled { opacity: 0.4; cursor: not-allowed; }

  .game-wrap {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .hud {
    background: #1a1a2e;
    border: 2px solid #2d2d52;
    border-radius: 10px;
    padding: 12px 18px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: space-between;
    font-size: 15px;
  }
  .hud div { display: flex; gap: 6px; }
  .hud .lbl { color: #b8c1ec; }
  .hud .v { color: #ffd700; font-weight: bold; }
  .hud .v.vuln { color: #4ad8ff; }
  .hud .v.hunt { color: #ff6b6b; }
  canvas {
    background: #000;
    border: 2px solid #2d2d52;
    border-radius: 10px;
    display: block;
    width: 100%;
    height: auto;
    max-width: 800px;
  }
  .help {
    color: #6c7396;
    font-size: 12px;
    text-align: center;
  }
  .canvas-wrap { position: relative; }

  /* Ghost selector (Cazador mode) */
  .ghost-selector {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    background: #1a1a2e;
    border: 2px solid #2d2d52;
    border-radius: 10px;
    padding: 10px;
  }
  .ghost-btn {
    width: 50px;
    height: 50px;
    border-radius: 8px;
    border: 3px solid transparent;
    background: #2d2d52;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    transition: all 0.15s;
  }
  .ghost-btn.selected {
    border-color: #ffd700;
    box-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
  }
  .ghost-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* Mobile D-pad */
  .dpad {
    display: none;
    margin-top: 12px;
    background: #1a1a2e;
    border: 2px solid #2d2d52;
    border-radius: 10px;
    padding: 14px;
  }
  .dpad.active { display: block; }
  .dpad-grid {
    display: grid;
    grid-template-columns: repeat(3, 70px);
    grid-template-rows: repeat(3, 70px);
    gap: 6px;
    justify-content: center;
    margin: 0 auto;
  }
  .dpad-btn {
    background: #2d2d52;
    color: #ffd700;
    border: 2px solid #444a7a;
    border-radius: 12px;
    font-size: 28px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  .dpad-btn:active, .dpad-btn.pressed {
    background: #ffd700;
    color: #000;
  }
  .dpad-up    { grid-column: 2; grid-row: 1; }
  .dpad-left  { grid-column: 1; grid-row: 2; }
  .dpad-right { grid-column: 3; grid-row: 2; }
  .dpad-down  { grid-column: 2; grid-row: 3; }
  .dpad-mid   { grid-column: 2; grid-row: 2; background: #0f0f1f; border: none; cursor: default; }

  /* Responsive */
  @media (max-width: 1099px) {
    body { padding: 10px; }
    .app {
      grid-template-columns: 1fr;
      max-width: 820px;
    }
    .canvas-wrap { max-width: 100%; }
  }
  @media (max-width: 600px) {
    body { padding: 6px; }
    .panel { padding: 12px; }
    .hud { font-size: 13px; padding: 8px 10px; }
    .dpad-grid {
      grid-template-columns: repeat(3, 60px);
      grid-template-rows: repeat(3, 60px);
    }
  }
  /* Landscape phones: side-by-side compact */
  @media (max-height: 500px) and (orientation: landscape) {
    body { padding: 4px; }
    .app {
      grid-template-columns: 220px 1fr;
      gap: 8px;
    }
    .panel { padding: 10px; font-size: 12px; }
    .panel h2 { font-size: 14px; }
    .control { margin-bottom: 8px; }
    .hud { font-size: 12px; padding: 6px 8px; }
    .dpad-grid {
      grid-template-columns: repeat(3, 50px);
      grid-template-rows: repeat(3, 50px);
    }
  }
</style>
</head>
<body>
<div class="app">
  <div class="panel">
    <h2>Panel de Control</h2>

    <div class="control">
      <label>Modo de Juego</label>
      <select id="gameMode">
        <option value="classic" selected>Clásico (comer puntos)</option>
        <option value="hunt">Cacería (comer fantasmas)</option>
        <option value="hunter">Cazador (controlar fantasmas)</option>
      </select>
    </div>

    <div class="control">
      <label>Cantidad de Fantasmas <span class="val" id="v-ghostCount">4</span></label>
      <input type="range" id="ghostCount" min="1" max="6" value="4" step="1" />
    </div>

    <div class="control">
      <label>Dificultad</label>
      <select id="gameDifficulty">
        <option value="easy">Fácil</option>
        <option value="normal" selected>Normal</option>
        <option value="hard">Difícil</option>
      </select>
    </div>

    <div class="control">
      <label>Velocidad Fantasmas <span class="val" id="v-ghostSpeed">1.0</span>x</label>
      <input type="range" id="ghostSpeed" min="0.5" max="3" value="1" step="0.1" />
    </div>

    <div class="control">
      <label>Velocidad Pac-Man <span class="val" id="v-pacmanSpeed">1.2</span>x</label>
      <input type="range" id="pacmanSpeed" min="0.5" max="2.5" value="1.2" step="0.1" />
    </div>

    <div class="control" id="ctrl-powerPellet">
      <label>Umbral Power Pellet <span class="val" id="v-powerPelletPoints">50</span></label>
      <input type="range" id="powerPelletPoints" min="30" max="100" value="50" step="5" />
    </div>

    <div class="control">
      <label>Complejidad Laberinto</label>
      <select id="mazeComplexity">
        <option value="simple">Simple</option>
        <option value="standard" selected>Estándar</option>
        <option value="complex">Complejo</option>
      </select>
    </div>

    <div class="control hidden" id="ctrl-respawnToggle">
      <label class="toggle">
        <input type="checkbox" id="ghostRespawn" />
        <span>Respawn de fantasmas</span>
      </label>
    </div>

    <div class="control hidden" id="ctrl-respawnTime">
      <label>Respawn cada <span class="val" id="v-ghostRespawnTime">30</span>s</label>
      <input type="range" id="ghostRespawnTime" min="15" max="180" value="30" step="5" />
    </div>

    <div class="buttons">
      <button class="primary" id="btnStart">Iniciar Juego</button>
      <button id="btnPause">Pausa</button>
      <button id="btnReset">Reiniciar</button>
      <button class="full" id="btnMobile">Controles Móviles: OFF</button>
    </div>

    <p class="help" id="helpText" style="margin-top:16px">Usa las flechas ← ↑ → ↓ para mover Pac-Man.</p>
  </div>

  <div class="game-wrap">
    <div class="hud">
      <div><span class="lbl">Score:</span> <span class="v" id="hudScore">0</span></div>
      <div><span class="lbl">Vidas:</span> <span class="v" id="hudLives">3</span></div>
      <div><span class="lbl">Nivel:</span> <span class="v" id="hudLevel">1</span></div>
      <div id="hudVulnWrap"><span class="lbl">Vuln:</span> <span class="v vuln" id="hudVuln">--</span></div>
      <div id="hudHuntWrap" style="display:none"><span class="lbl">Cazados:</span> <span class="v hunt" id="hudHunt">0/0</span></div>
    </div>

    <div class="ghost-selector" id="ghostSelector" style="display:none">
      <!-- buttons injected by JS -->
    </div>

    <div class="canvas-wrap">
      <canvas id="game" width="800" height="600"></canvas>
    </div>

    <div class="dpad" id="dpad">
      <div class="dpad-grid">
        <button class="dpad-btn dpad-up"    data-dir="up">▲</button>
        <button class="dpad-btn dpad-left"  data-dir="left">◀</button>
        <button class="dpad-btn dpad-mid"   disabled></button>
        <button class="dpad-btn dpad-right" data-dir="right">▶</button>
        <button class="dpad-btn dpad-down"  data-dir="down">▼</button>
      </div>
    </div>
  </div>
</div>

<script>
// ============================================================
//  Pac-Man Configurable - Vanilla Canvas
// ============================================================

const CANVAS_W = 800;
const CANVAS_H = 600;
const COLS = 32;
const ROWS = 24;
const CELL = 25; // 32*25=800, 24*25=600

// Cell types:
//  1 = wall, 0 = empty, 2 = pellet, 3 = power pellet,
//  4 = ghost house, 5 = tunnel/empty
const Tile = { WALL:1, EMPTY:0, PELLET:2, POWER:3, HOUSE:4 };

// ---------- Maze layouts (32x24) ----------
// Use strings for compactness; characters:
//   # wall, . pellet, o power, ' ' empty, H ghost house, T tunnel-empty
function parseMaze(rows) {
  const grid = [];
  for (let y = 0; y < ROWS; y++) {
    const r = rows[y].padEnd(COLS, '#').slice(0, COLS);
    const row = [];
    for (let x = 0; x < COLS; x++) {
      const c = r[x];
      if (c === '#') row.push(Tile.WALL);
      else if (c === '.') row.push(Tile.PELLET);
      else if (c === 'o') row.push(Tile.POWER);
      else if (c === 'H') row.push(Tile.HOUSE);
      else row.push(Tile.EMPTY);
    }
    grid.push(row);
  }
  return grid;
}

const MAZES = {
  standard: [
    "################################",
    "#o............##............o..#",
    "#.####.#####.##.#####.####.###.#",
    "#.####.#####.##.#####.####.###.#",
    "#..............................#",
    "#.####.##.########.##.####.###.#",
    "#......##....##....##......#...#",
    "######.#####.##.#####.######...#",
    "######.##..........##.######...#",
    "######.##.###HH###.##.######...#",
    "T.........#H    H#.............T",
    "######.##.#H    H#.##.######...#",
    "######.##.########.##.######...#",
    "######.##..........##.######...#",
    "######.##.########.##.######...#",
    "#............##................#",
    "#.####.#####.##.#####.####.....#",
    "#o..##................##.....o.#",
    "###.##.##.########.##.##.......#",
    "#......##....##....##..........#",
    "#.##########.##.##########.....#",
    "#..............................#",
    "#.####.#####.##.#####.####.....#",
    "################################"
  ],
  simple: [
    "################################",
    "#o............................o#",
    "#..............................#",
    "#..####...####....####...####..#",
    "#..............................#",
    "#..............................#",
    "#..####...####....####...####..#",
    "#..............................#",
    "#..............................#",
    "T.........#HH    HH#...........T",
    "T.........#H      H#...........T",
    "T.........#HH    HH#...........T",
    "#..............................#",
    "#..............................#",
    "#..####...####....####...####..#",
    "#..............................#",
    "#..............................#",
    "#..####...####....####...####..#",
    "#..............................#",
    "#..............................#",
    "#..####...####....####...####..#",
    "#..............................#",
    "#o............................o#",
    "################################"
  ],
  complex: [
    "################################",
    "#o..#......#....#....#......#.o#",
    "#.#.#.####.#.##.#.##.#.####.#..#",
    "#.#...#....#.##.#.##.#....#....#",
    "#.###.#.####.##.#.##.####.#.##.#",
    "#.....#......##...##......#....#",
    "###.#########.#####.########.#.#",
    "#...#.....##.........##....#...#",
    "#.#.#.###.##.#####.##.###.#.#..#",
    "#.#...###.HH#     #HH.###...#..#",
    "T.#.#.....H #     # H.....#.#..T",
    "#.#.#.###.HH#     #HH.###.#.#..#",
    "#...#.###.##.#####.##.###.#....#",
    "#.#.#......##......##....#.##..#",
    "#.#.#.######.######.######.##..#",
    "#.#.#.....#....#....#......#...#",
    "#.#.#####.#.##.#.##.#.######...#",
    "#.....#...#.##.#.##.#...#......#",
    "###.#.#.#.####.#.####.#.#.#####.",
    "#...#...#......#......#...#....#",
    "#.#####.################.#####.#",
    "#..............................#",
    "#o............................o#",
    "################################"
  ]
};

// ---------- Game State ----------
const State = {
  config: {
    ghostCount: 4,
    gameDifficulty: 'normal',
    ghostSpeed: 1.0,
    pacmanSpeed: 1.2,
    powerPelletPoints: 50,
    mazeComplexity: 'standard',
    gameMode: 'classic',         // 'classic' | 'hunt' | 'hunter'
    ghostRespawn: false,
    ghostRespawnTime: 30
  },
  grid: null,
  pellets: 0,
  totalPellets: 0,
  pacman: null,
  ghosts: [],
  score: 0,
  lives: 3,
  level: 1,
  vulnTimer: 0,           // seconds remaining
  pelletProgress: 0,      // accumulated points toward next power
  running: false,
  paused: false,
  message: '',
  messageTimer: 0,
  lastTime: 0,
  // Mode-specific
  huntCount: 0,           // unique ghost kills in hunt mode (resets when respawn ON?)
  selectedGhostId: 0,     // hunter mode: which ghost the player drives
  mobile: false,
  pacAiNextDir: null      // hunter mode: AI pacman planned dir
};

// Base speeds (cells per second)
const PAC_BASE = 5.5;
const GHOST_BASE = 4.5;

// ---------- Utility ----------
const DIRS = {
  up:    { x: 0, y: -1 },
  down:  { x: 0, y:  1 },
  left:  { x: -1, y: 0 },
  right: { x: 1,  y: 0 },
  none:  { x: 0, y: 0 }
};

function isWall(grid, cx, cy) {
  if (cy < 0 || cy >= ROWS) return true;
  if (cx < 0 || cx >= COLS) return false; // tunnel
  return grid[cy][cx] === Tile.WALL;
}
function isPassableForPac(grid, cx, cy) {
  if (cy < 0 || cy >= ROWS) return false;
  if (cx < 0 || cx >= COLS) return true; // tunnel wrap
  const t = grid[cy][cx];
  return t !== Tile.WALL && t !== Tile.HOUSE;
}
function isPassableForGhost(grid, cx, cy, allowHouse) {
  if (cy < 0 || cy >= ROWS) return false;
  if (cx < 0 || cx >= COLS) return true;
  const t = grid[cy][cx];
  if (t === Tile.WALL) return false;
  if (t === Tile.HOUSE) return !!allowHouse;
  return true;
}
function wrapX(x) {
  if (x < 0) return COLS - 1;
  if (x >= COLS) return 0;
  return x;
}

// ---------- BFS Pathfinding ----------
function bfsNext(grid, from, to, allowHouse) {
  const visited = new Uint8Array(COLS * ROWS);
  const prev = new Int16Array(COLS * ROWS).fill(-1);
  const idx = (x, y) => y * COLS + x;
  const q = [];
  q.push([from.x, from.y]);
  visited[idx(from.x, from.y)] = 1;
  let found = false;
  while (q.length) {
    const [x, y] = q.shift();
    if (x === to.x && y === to.y) { found = true; break; }
    for (const d of [DIRS.up, DIRS.down, DIRS.left, DIRS.right]) {
      const nx = wrapX(x + d.x);
      const ny = y + d.y;
      if (ny < 0 || ny >= ROWS) continue;
      if (!isPassableForGhost(grid, nx, ny, allowHouse)) continue;
      const id = idx(nx, ny);
      if (visited[id]) continue;
      visited[id] = 1;
      prev[id] = idx(x, y);
      q.push([nx, ny]);
    }
  }
  if (!found) return null;
  // Walk back from to -> from, pick first step after from
  let curId = idx(to.x, to.y);
  let nextId = curId;
  while (prev[curId] !== -1 && prev[curId] !== idx(from.x, from.y)) {
    curId = prev[curId];
  }
  if (prev[curId] === -1) return null;
  const nx = curId % COLS;
  const ny = Math.floor(curId / COLS);
  return { x: nx - from.x, y: ny - from.y };
}

// Direction to step toward nearest pellet, via BFS, using pacman passability.
function bfsFirstStepToNearestPellet(grid, from) {
  const visited = new Uint8Array(COLS * ROWS);
  const prev = new Int16Array(COLS * ROWS).fill(-1);
  const idx = (x, y) => y * COLS + x;
  const q = [];
  q.push([from.x, from.y]);
  visited[idx(from.x, from.y)] = 1;
  let foundId = -1;
  while (q.length) {
    const [x, y] = q.shift();
    const t = grid[y][x];
    if ((t === Tile.PELLET || t === Tile.POWER) && !(x === from.x && y === from.y)) {
      foundId = idx(x, y);
      break;
    }
    for (const d of [DIRS.up, DIRS.down, DIRS.left, DIRS.right]) {
      const nx = wrapX(x + d.x);
      const ny = y + d.y;
      if (ny < 0 || ny >= ROWS) continue;
      if (!isPassableForPac(grid, nx, ny)) continue;
      const id = idx(nx, ny);
      if (visited[id]) continue;
      visited[id] = 1;
      prev[id] = idx(x, y);
      q.push([nx, ny]);
    }
  }
  if (foundId === -1) return null;
  let curId = foundId;
  while (prev[curId] !== -1 && prev[curId] !== idx(from.x, from.y)) {
    curId = prev[curId];
  }
  if (prev[curId] === -1) return null;
  const nx = curId % COLS;
  const ny = Math.floor(curId / COLS);
  // Normalize to unit dir (handle tunnel wrap)
  let dx = nx - from.x;
  let dy = ny - from.y;
  if (dx > 1) dx = -1;
  else if (dx < -1) dx = 1;
  return { x: dx, y: dy };
}

function pacAIChoose(pac) {
  const cx = pac.cx, cy = pac.cy;
  const validDirs = [];
  for (const d of [DIRS.up, DIRS.down, DIRS.left, DIRS.right]) {
    const nx = wrapX(cx + d.x);
    const ny = cy + d.y;
    if (isPassableForPac(State.grid, nx, ny)) validDirs.push(d);
  }
  if (validDirs.length === 0) return DIRS.none;

  // Identify nearby threats (ghosts that can hurt pacman)
  const threats = [];
  for (const g of State.ghosts) {
    if (g.gone || g.eaten || g.vulnerable) continue;
    if (g.releaseTimer > 0) continue;
    const d = Math.abs(g.cx - cx) + Math.abs(g.cy - cy);
    if (d <= 6) threats.push({ x: g.cx, y: g.cy, dist: d });
  }

  const stepTowardPellet = bfsFirstStepToNearestPellet(State.grid, { x: cx, y: cy });

  let bestDir = validDirs[0];
  let bestScore = -Infinity;
  for (const d of validDirs) {
    const nx = wrapX(cx + d.x);
    const ny = cy + d.y;
    let score = 0;
    if (stepTowardPellet && d.x === stepTowardPellet.x && d.y === stepTowardPellet.y) {
      score += 50;
    }
    for (const t of threats) {
      const dToGhost = Math.abs(nx - t.x) + Math.abs(ny - t.y);
      if (dToGhost <= 4) score -= 80 / (dToGhost + 0.5);
    }
    // Slight bias to not reverse direction (smoother)
    if (d.x === -pac.dir.x && d.y === -pac.dir.y && (pac.dir.x !== 0 || pac.dir.y !== 0)) {
      score -= 2;
    }
    if (score > bestScore) { bestScore = score; bestDir = d; }
  }
  return bestDir;
}

// ---------- Init ----------
function buildLevel() {
  const layout = MAZES[State.config.mazeComplexity];
  State.grid = parseMaze(layout);
  State.pellets = 0;
  State.totalPellets = 0;
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (State.grid[y][x] === Tile.PELLET || State.grid[y][x] === Tile.POWER) {
        State.totalPellets++;
        State.pellets++;
      }
    }
  }

  // Pac-Man start position: find a sensible empty spot in lower half
  const start = findPacStart();
  State.pacman = makePacman(start.x, start.y);

  // Ghosts
  State.ghosts = [];
  const ghostColors = ['#ff3b3b', '#ffb8de', '#4ad8ff', '#ffb454', '#a0ffa0', '#d28cff'];
  const homeSpots = findHouseCenters();
  const homeIdx = (i) => homeSpots[i % homeSpots.length] || { x: 15, y: 10 };
  for (let i = 0; i < State.config.ghostCount; i++) {
    const home = homeIdx(i);
    State.ghosts.push(makeGhost(home.x, home.y, ghostColors[i % ghostColors.length], i));
  }
}

function findPacStart() {
  // Prefer center-bottom area
  const targetY = Math.floor(ROWS * 0.78);
  const cx = Math.floor(COLS / 2);
  // Spiral outward to find a passable, non-house cell with a pellet (or empty)
  for (let radius = 0; radius < 12; radius++) {
    for (let dy = -radius; dy <= radius; dy++) {
      for (let dx = -radius; dx <= radius; dx++) {
        const x = cx + dx, y = targetY + dy;
        if (y < 0 || y >= ROWS || x < 0 || x >= COLS) continue;
        const t = State.grid[y][x];
        if (t !== Tile.WALL && t !== Tile.HOUSE) return { x, y };
      }
    }
  }
  return { x: 1, y: 1 };
}

function findHouseCenters() {
  // Find passable (non-wall, non-house) cells near the centre of the maze.
  // These become ghost spawn / "home" points. Avoiding HOUSE cells ensures
  // ghosts can actually move around instead of being trapped inside.
  const spots = [];
  const ccx = Math.floor(COLS / 2);
  const ccy = Math.floor(ROWS / 2);
  for (let r = 1; r < 10 && spots.length < 8; r++) {
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
        const x = ccx + dx, y = ccy + dy;
        if (y < 0 || y >= ROWS || x < 0 || x >= COLS) continue;
        const t = State.grid[y][x];
        if (t !== Tile.WALL && t !== Tile.HOUSE) {
          if (!spots.some(s => s.x === x && s.y === y)) spots.push({ x, y });
        }
      }
    }
  }
  if (spots.length === 0) spots.push({ x: 1, y: 1 });
  return spots;
}

function makePacman(cx, cy) {
  return {
    cx, cy,                  // cell coords
    px: cx + 0.5, py: cy + 0.5, // pixel-in-cell coords (cells)
    dir: DIRS.none,
    nextDir: DIRS.none,
    mouth: 0
  };
}

function makeGhost(cx, cy, color, id) {
  const mode = State.config.gameMode;
  return {
    cx, cy,
    px: cx + 0.5, py: cy + 0.5,
    dir: DIRS.left,
    nextDir: DIRS.none,
    color,
    id,
    home: { x: cx, y: cy },
    vulnerable: mode === 'hunt',
    eaten: false,
    gone: false,
    respawnTimer: 0,
    releaseTimer: mode === 'hunter' ? 0 : id * 1.2
  };
}

// ---------- Movement helpers ----------
// Next half-integer position along the direction of motion (in cell units).
function nextSnap(p, dirSign) {
  if (dirSign > 0) return Math.floor(p - 0.5) + 1.5;
  if (dirSign < 0) return Math.ceil(p + 0.5) - 1.5;
  return p;
}

function isAtCenter(p) {
  const f = p - Math.floor(p);
  return Math.abs(f - 0.5) < 1e-3;
}

// ---------- Update ----------
function update(dt) {
  if (!State.running || State.paused) return;

  // Pac-Man
  updatePacman(dt);
  // Ghosts
  for (const g of State.ghosts) updateGhost(g, dt);
  // Collisions
  checkCollisions();

  // Vulnerability timer
  if (State.vulnTimer > 0) {
    State.vulnTimer -= dt;
    if (State.vulnTimer <= 0) {
      State.vulnTimer = 0;
      for (const g of State.ghosts) {
        if (!g.eaten) g.vulnerable = false;
      }
    }
  }

  // Message
  if (State.messageTimer > 0) {
    State.messageTimer -= dt;
    if (State.messageTimer <= 0) State.message = '';
  }

  // Win/loss per mode
  if (State.pellets === 0) {
    const mode = State.config.gameMode;
    if (mode === 'classic') {
      nextLevel();
    } else if (mode === 'hunter') {
      // Pac-Man cleared all pellets -> ghosts lose
      State.running = false;
      showMessage("¡PAC-MAN GANA!", 99);
    } else {
      // hunt: refill pellets so player keeps scoring while hunting
      refillPellets();
    }
  }
}

function refillPellets() {
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (State.grid[y][x] === Tile.EMPTY) {
        // Restore as a small pellet unless it's the pacman cell
        if (State.pacman && x === State.pacman.cx && y === State.pacman.cy) continue;
        // Skip cells that were never pellets (interior of ghost house has no pellets)
        // Detect by checking original maze char; cheap approximation: skip cells around house center
        const inHouse = Math.abs(x - COLS/2) <= 3 && Math.abs(y - ROWS/2) <= 1;
        if (inHouse) continue;
        State.grid[y][x] = Tile.PELLET;
        State.pellets++;
        State.totalPellets++;
      }
    }
  }
}

function eatAt(cx, cy) {
  const row = State.grid[cy];
  if (!row) return;
  const tile = row[cx];
  if (tile === Tile.PELLET) {
    row[cx] = Tile.EMPTY;
    State.score += 10;
    State.pelletProgress += 10;
    State.pellets--;
    checkPowerThreshold();
    checkBonusThreshold();
  } else if (tile === Tile.POWER) {
    row[cx] = Tile.EMPTY;
    State.score += 50;
    State.pelletProgress += 50;
    State.pellets--;
    activateVulnerability();
    checkBonusThreshold();
  }
}

function updatePacman(dt) {
  const pac = State.pacman;
  const speed = PAC_BASE * State.config.pacmanSpeed;
  let remaining = speed * dt;
  pac.mouth += dt * 10;

  let safety = 64;
  while (remaining > 1e-9 && safety-- > 0) {
    if (pac.px < 0) pac.px += COLS;
    else if (pac.px >= COLS) pac.px -= COLS;

    const cx = Math.floor(pac.px);
    const cy = Math.floor(pac.py);

    if (isAtCenter(pac.px) && isAtCenter(pac.py)) {
      pac.px = cx + 0.5;
      pac.py = cy + 0.5;
      pac.cx = cx;
      pac.cy = cy;
      eatAt(cx, cy);

      if (State.config.gameMode === 'hunter') {
        pac.nextDir = pacAIChoose(pac);
      }

      if (pac.nextDir !== DIRS.none) {
        const nx = wrapX(cx + pac.nextDir.x);
        const ny = cy + pac.nextDir.y;
        if (isPassableForPac(State.grid, nx, ny)) {
          pac.dir = pac.nextDir;
        }
      }
      if (pac.dir !== DIRS.none) {
        const nx = wrapX(cx + pac.dir.x);
        const ny = cy + pac.dir.y;
        if (!isPassableForPac(State.grid, nx, ny)) {
          pac.dir = DIRS.none;
        }
      }
      if (pac.dir === DIRS.none) return;
    }

    const targetX = nextSnap(pac.px, pac.dir.x);
    const targetY = nextSnap(pac.py, pac.dir.y);
    const dist = Math.abs(targetX - pac.px) + Math.abs(targetY - pac.py);
    if (dist < 1e-9) break;

    const step = Math.min(remaining, dist);
    if (step >= dist - 1e-9) {
      pac.px = targetX;
      pac.py = targetY;
    } else {
      pac.px += pac.dir.x * step;
      pac.py += pac.dir.y * step;
    }
    remaining -= step;
  }

  if (pac.px < 0) pac.px += COLS;
  else if (pac.px >= COLS) pac.px -= COLS;
  pac.cx = Math.floor(pac.px);
  pac.cy = Math.floor(pac.py);
}

function checkPowerThreshold() {
  if (State.pelletProgress >= State.config.powerPelletPoints) {
    State.pelletProgress = 0;
    activateVulnerability();
  }
}

function activateVulnerability() {
  // Hunt mode: ghosts always vulnerable; power pellet just gives points.
  // Hunter mode: vulnerability doesn't apply (player is the hunter).
  if (State.config.gameMode !== 'classic') return;
  State.vulnTimer = 10;
  for (const g of State.ghosts) {
    if (!g.eaten && !g.gone) {
      g.vulnerable = true;
      g.dir = { x: -g.dir.x, y: -g.dir.y };
    }
  }
}

function checkBonusThreshold() {
  const eaten = State.totalPellets - State.pellets;
  if (!State._bonusGiven && eaten / State.totalPellets >= 0.8) {
    State._bonusGiven = true;
    State.score += 500;
    showMessage("¡BONUS +500!", 2);
  }
}

function updateGhost(g, dt) {
  // Respawn countdown (hunt mode w/ respawn ON)
  if (g.gone) {
    if (g.respawnTimer > 0) {
      g.respawnTimer -= dt;
      if (g.respawnTimer <= 0) {
        g.gone = false;
        g.eaten = false;
        g.vulnerable = State.config.gameMode === 'hunt';
        g.px = g.home.x + 0.5;
        g.py = g.home.y + 0.5;
        g.cx = g.home.x;
        g.cy = g.home.y;
        g.dir = DIRS.left;
        g.releaseTimer = 0.5;
      }
    }
    return;
  }
  if (g.releaseTimer > 0) { g.releaseTimer -= dt; return; }

  const speed = (g.vulnerable ? 0.6 : 1.0) * (g.eaten ? 2.2 : 1.0) * GHOST_BASE * State.config.ghostSpeed;
  let remaining = speed * dt;

  let safety = 64;
  while (remaining > 1e-9 && safety-- > 0) {
    if (g.px < 0) g.px += COLS;
    else if (g.px >= COLS) g.px -= COLS;

    const cx = Math.floor(g.px);
    const cy = Math.floor(g.py);

    if (isAtCenter(g.px) && isAtCenter(g.py)) {
      g.px = cx + 0.5;
      g.py = cy + 0.5;
      g.cx = cx;
      g.cy = cy;

      if (g.eaten && g.cx === g.home.x && g.cy === g.home.y) {
        g.eaten = false;
        g.vulnerable = false;
      }

      chooseGhostDirection(g);
      if (g.dir === DIRS.none) return;
    }

    const targetX = nextSnap(g.px, g.dir.x);
    const targetY = nextSnap(g.py, g.dir.y);
    const dist = Math.abs(targetX - g.px) + Math.abs(targetY - g.py);
    if (dist < 1e-9) break;

    const step = Math.min(remaining, dist);
    if (step >= dist - 1e-9) {
      g.px = targetX;
      g.py = targetY;
    } else {
      g.px += g.dir.x * step;
      g.py += g.dir.y * step;
    }
    remaining -= step;
  }

  if (g.px < 0) g.px += COLS;
  else if (g.px >= COLS) g.px -= COLS;
  g.cx = Math.floor(g.px);
  g.cy = Math.floor(g.py);
}

function chooseGhostDirection(g) {
  const pac = State.pacman;
  const diff = State.config.gameDifficulty;
  const allowHouse = g.eaten; // only eyes can enter house

  // Available directions (excluding reverse unless dead end)
  const opts = [];
  for (const d of [DIRS.up, DIRS.down, DIRS.left, DIRS.right]) {
    const nx = wrapX(g.cx + d.x);
    const ny = g.cy + d.y;
    if (!isPassableForGhost(State.grid, nx, ny, allowHouse)) continue;
    // skip immediate reverse if other options
    if (d.x === -g.dir.x && d.y === -g.dir.y && (d.x !== 0 || d.y !== 0)) {
      opts.push({ d, isReverse: true });
    } else {
      opts.push({ d, isReverse: false });
    }
  }
  if (opts.length === 0) {
    g.dir = { x: -g.dir.x, y: -g.dir.y };
    return;
  }
  const nonReverse = opts.filter(o => !o.isReverse);
  const choices = nonReverse.length > 0 ? nonReverse : opts;

  // Hunter mode: player-controlled ghost obeys queued input
  if (State.config.gameMode === 'hunter' && g.id === State.selectedGhostId && !g.eaten) {
    if (g.nextDir && (g.nextDir.x !== 0 || g.nextDir.y !== 0)) {
      const candidate = opts.find(o => o.d.x === g.nextDir.x && o.d.y === g.nextDir.y);
      if (candidate) {
        g.dir = candidate.d;
        return;
      }
    }
    // Otherwise continue same dir if valid, else pick any non-reverse
    const same = opts.find(o => o.d.x === g.dir.x && o.d.y === g.dir.y);
    if (same) { g.dir = same.d; return; }
    g.dir = choices[0].d;
    return;
  }

  // Decide behavior
  let target;
  if (g.eaten) {
    target = g.home;
  } else if (g.vulnerable) {
    // Flee: pick direction maximizing distance from Pac-Man
    let best = choices[0], bestDist = -Infinity;
    for (const o of choices) {
      const nx = wrapX(g.cx + o.d.x);
      const ny = g.cy + o.d.y;
      const dist = Math.hypot(nx - pac.cx, ny - pac.cy);
      if (dist > bestDist) { bestDist = dist; best = o; }
    }
    g.dir = best.d;
    return;
  } else {
    target = { x: pac.cx, y: pac.cy };
  }

  // Difficulty-based randomness
  let randomChance = 0;
  if (diff === 'easy') randomChance = 0.5;
  else if (diff === 'normal') randomChance = 0.15;
  else randomChance = 0.0;

  // Hard: coordinate - half target ahead of pacman
  if (diff === 'hard' && !g.eaten) {
    if (g.id % 2 === 0) {
      // Ambush: target 4 cells ahead of Pac-Man
      target = {
        x: wrapX(pac.cx + pac.dir.x * 4),
        y: Math.max(0, Math.min(ROWS - 1, pac.cy + pac.dir.y * 4))
      };
    }
  }

  if (Math.random() < randomChance) {
    g.dir = choices[Math.floor(Math.random() * choices.length)].d;
    return;
  }

  // BFS chase: find next direction toward target
  const next = bfsNext(State.grid, { x: g.cx, y: g.cy }, target, allowHouse);
  if (next) {
    // Validate against choices (no immediate reverse)
    const matches = choices.find(o => o.d.x === next.x && o.d.y === next.y);
    if (matches) {
      g.dir = matches.d;
      return;
    }
  }

  // Fallback: greedy direction to target
  let best = choices[0], bestDist = Infinity;
  for (const o of choices) {
    const nx = wrapX(g.cx + o.d.x);
    const ny = g.cy + o.d.y;
    const dist = Math.hypot(nx - target.x, ny - target.y);
    if (dist < bestDist) { bestDist = dist; best = o; }
  }
  g.dir = best.d;
}

function checkCollisions() {
  const pac = State.pacman;
  const mode = State.config.gameMode;
  for (const g of State.ghosts) {
    if (g.eaten || g.gone) continue;
    const dx = pac.px - g.px;
    const dy = pac.py - g.py;
    if (Math.hypot(dx, dy) < 0.7) {
      if (mode === 'hunter') {
        // Ghosts hunt pacman - any contact = catch
        State.running = false;
        showMessage("¡FANTASMAS GANAN!", 99);
        return;
      }
      if (g.vulnerable) {
        State.score += 200;
        showMessage("+200", 0.8);
        if (mode === 'hunt') {
          State.huntCount++;
          if (State.config.ghostRespawn) {
            g.gone = true;
            g.eaten = false;
            g.respawnTimer = State.config.ghostRespawnTime;
            g.vulnerable = false;
          } else {
            g.gone = true;
            g.eaten = false;
            g.vulnerable = false;
          }
          checkHuntWin();
        } else {
          g.eaten = true;
          g.vulnerable = false;
        }
      } else {
        loseLife();
        return;
      }
    }
  }
}

function checkHuntWin() {
  // Win if every ghost is currently gone/eaten
  const allGone = State.ghosts.every(g => g.gone || g.eaten);
  if (allGone) {
    State.running = false;
    showMessage("¡CAZA COMPLETA!", 99);
  }
}

function loseLife() {
  State.lives--;
  if (State.lives <= 0) {
    State.running = false;
    showMessage("¡GAME OVER!", 99);
  } else {
    showMessage("¡VIDA PERDIDA!", 1.5);
    // Reset positions
    const s = findPacStart();
    State.pacman = makePacman(s.x, s.y);
    const ghostColors = ['#ff3b3b', '#ffb8de', '#4ad8ff', '#ffb454', '#a0ffa0', '#d28cff'];
    const homeSpots = findHouseCenters();
    State.ghosts = [];
    for (let i = 0; i < State.config.ghostCount; i++) {
      const home = homeSpots[i % homeSpots.length];
      State.ghosts.push(makeGhost(home.x, home.y, ghostColors[i % ghostColors.length], i));
    }
    State.vulnTimer = 0;
  }
}

function nextLevel() {
  State.level++;
  State._bonusGiven = false;
  showMessage("¡NIVEL " + State.level + "!", 2);
  buildLevel();
}

function showMessage(txt, secs) {
  State.message = txt;
  State.messageTimer = secs;
}

// ---------- Rendering ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function render() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  // Maze
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const t = State.grid[y][x];
      const px = x * CELL;
      const py = y * CELL;
      if (t === Tile.WALL) {
        ctx.fillStyle = '#1f1f4f';
        ctx.fillRect(px, py, CELL, CELL);
        ctx.strokeStyle = '#3a3aff';
        ctx.lineWidth = 2;
        ctx.strokeRect(px + 1, py + 1, CELL - 2, CELL - 2);
      } else if (t === Tile.HOUSE) {
        ctx.fillStyle = '#101030';
        ctx.fillRect(px, py, CELL, CELL);
        ctx.strokeStyle = '#5a5aff';
        ctx.lineWidth = 1;
        ctx.strokeRect(px + 1, py + 1, CELL - 2, CELL - 2);
      } else if (t === Tile.PELLET) {
        ctx.fillStyle = '#ffd29c';
        ctx.beginPath();
        ctx.arc(px + CELL / 2, py + CELL / 2, 2.5, 0, Math.PI * 2);
        ctx.fill();
      } else if (t === Tile.POWER) {
        ctx.fillStyle = '#ffe066';
        ctx.beginPath();
        const pulse = 6 + Math.sin(performance.now() / 150) * 1.5;
        ctx.arc(px + CELL / 2, py + CELL / 2, pulse, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // Pac-Man
  drawPacman(State.pacman);
  // Ghosts
  for (const g of State.ghosts) drawGhost(g);

  // Message overlay
  if (State.message) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, CANVAS_H / 2 - 40, CANVAS_W, 80);
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 36px Segoe UI';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(State.message, CANVAS_W / 2, CANVAS_H / 2);
  }

  if (!State.running && !State.message) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 28px Segoe UI';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Configura los parámetros y pulsa "Iniciar Juego"', CANVAS_W / 2, CANVAS_H / 2);
  }
  if (State.paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 48px Segoe UI';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('PAUSA', CANVAS_W / 2, CANVAS_H / 2);
  }
}

function drawPacman(pac) {
  const cx = pac.px * CELL;
  const cy = pac.py * CELL;
  const r = CELL * 0.45;
  let angle = 0;
  if (pac.dir === DIRS.right) angle = 0;
  else if (pac.dir === DIRS.down) angle = Math.PI / 2;
  else if (pac.dir === DIRS.left) angle = Math.PI;
  else if (pac.dir === DIRS.up) angle = -Math.PI / 2;
  const mouth = (Math.sin(pac.mouth) + 1) * 0.25 + 0.05;

  ctx.fillStyle = '#ffd700';
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.arc(cx, cy, r, angle + mouth, angle - mouth + Math.PI * 2);
  ctx.closePath();
  ctx.fill();
}

function drawGhost(g) {
  if (g.gone) return; // not drawn when respawning
  const cx = g.px * CELL;
  const cy = g.py * CELL;
  const r = CELL * 0.42;

  // Selection highlight in hunter mode
  if (State.config.gameMode === 'hunter' && g.id === State.selectedGhostId && !g.eaten) {
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(cx, cy, r + 4, 0, Math.PI * 2);
    ctx.stroke();
  }

  let bodyColor = g.color;
  if (g.eaten) bodyColor = 'rgba(255,255,255,0)';
  else if (State.config.gameMode === 'hunt') {
    // Always-vulnerable look: blue body, no end-of-timer blink
    bodyColor = '#2244ff';
  } else if (g.vulnerable) {
    const blink = State.vulnTimer < 3 && Math.floor(performance.now() / 200) % 2 === 0;
    bodyColor = blink ? '#ffffff' : '#2244ff';
  }

  if (!g.eaten) {
    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    ctx.arc(cx, cy - r * 0.1, r, Math.PI, 0);
    ctx.lineTo(cx + r, cy + r * 0.6);
    // wavy bottom
    const segs = 4;
    for (let i = segs; i >= 0; i--) {
      const xx = cx - r + (i / segs) * (r * 2);
      const yy = cy + r * 0.6 + (i % 2 === 0 ? 0 : -r * 0.25);
      ctx.lineTo(xx, yy);
    }
    ctx.closePath();
    ctx.fill();
  }

  // Eyes
  const eyeOffX = r * 0.35;
  const eyeOffY = -r * 0.15;
  const eyeR = r * 0.28;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(cx - eyeOffX, cy + eyeOffY, eyeR, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + eyeOffX, cy + eyeOffY, eyeR, 0, Math.PI * 2); ctx.fill();
  // Pupils look toward dir
  const pdx = g.dir.x * eyeR * 0.4;
  const pdy = g.dir.y * eyeR * 0.4;
  ctx.fillStyle = g.vulnerable && !g.eaten ? '#ff3030' : '#000';
  ctx.beginPath(); ctx.arc(cx - eyeOffX + pdx, cy + eyeOffY + pdy, eyeR * 0.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + eyeOffX + pdx, cy + eyeOffY + pdy, eyeR * 0.5, 0, Math.PI * 2); ctx.fill();
}

// ---------- HUD ----------
function renderHUD() {
  document.getElementById('hudScore').textContent = State.score;
  document.getElementById('hudLives').textContent = State.lives;
  document.getElementById('hudLevel').textContent = State.level;
  document.getElementById('hudVuln').textContent =
    State.vulnTimer > 0 ? State.vulnTimer.toFixed(1) + 's' : '--';
  const alive = State.ghosts.filter(g => !g.gone && !g.eaten).length;
  document.getElementById('hudHunt').textContent =
    State.huntCount + ' (vivos: ' + alive + ')';
}

// ---------- Loop ----------
function loop(now) {
  if (!State.lastTime) State.lastTime = now;
  const dt = Math.min(0.05, (now - State.lastTime) / 1000);
  State.lastTime = now;
  update(dt);
  render();
  renderHUD();
  requestAnimationFrame(loop);
}

// ---------- Controls ----------
function applyInputDir(d) {
  if (State.config.gameMode === 'hunter') {
    const g = State.ghosts[State.selectedGhostId];
    if (g) g.nextDir = d;
  } else {
    const pac = State.pacman;
    if (pac) pac.nextDir = d;
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp')    { applyInputDir(DIRS.up);    e.preventDefault(); }
  if (e.key === 'ArrowDown')  { applyInputDir(DIRS.down);  e.preventDefault(); }
  if (e.key === 'ArrowLeft')  { applyInputDir(DIRS.left);  e.preventDefault(); }
  if (e.key === 'ArrowRight') { applyInputDir(DIRS.right); e.preventDefault(); }
  if (e.key === ' ')          { togglePause(); e.preventDefault(); }
  // Number keys 1-6: select ghost in hunter mode
  if (State.config.gameMode === 'hunter') {
    const n = parseInt(e.key);
    if (!isNaN(n) && n >= 1 && n <= 6) {
      selectGhost(n - 1);
    }
  }
});

function bindRange(id, key, transform = v => parseFloat(v)) {
  const el = document.getElementById(id);
  const out = document.getElementById('v-' + id);
  const sync = () => {
    State.config[key] = transform(el.value);
    if (out) out.textContent = (typeof State.config[key] === 'number')
      ? (Number.isInteger(State.config[key]) ? State.config[key] : State.config[key].toFixed(1))
      : State.config[key];
  };
  el.addEventListener('input', sync);
  sync();
}
function bindSelect(id, key) {
  const el = document.getElementById(id);
  el.addEventListener('change', () => { State.config[key] = el.value; });
  State.config[key] = el.value;
}

bindRange('ghostCount', 'ghostCount', v => parseInt(v));
bindRange('ghostSpeed', 'ghostSpeed');
bindRange('pacmanSpeed', 'pacmanSpeed');
bindRange('powerPelletPoints', 'powerPelletPoints', v => parseInt(v));
bindRange('ghostRespawnTime', 'ghostRespawnTime', v => parseInt(v));
bindSelect('gameDifficulty', 'gameDifficulty');
bindSelect('mazeComplexity', 'mazeComplexity');

// Game mode select - also toggles UI visibility
const modeSelect = document.getElementById('gameMode');
modeSelect.addEventListener('change', () => {
  State.config.gameMode = modeSelect.value;
  syncModeUI();
});
State.config.gameMode = modeSelect.value;

// Respawn toggle
const respawnCb = document.getElementById('ghostRespawn');
respawnCb.addEventListener('change', () => {
  State.config.ghostRespawn = respawnCb.checked;
  syncModeUI();
});

function syncModeUI() {
  const mode = State.config.gameMode;
  // Power pellet umbral solo aplica al modo clásico
  document.getElementById('ctrl-powerPellet').classList.toggle('hidden', mode !== 'classic');
  // Respawn controls solo en modo cacería
  document.getElementById('ctrl-respawnToggle').classList.toggle('hidden', mode !== 'hunt');
  document.getElementById('ctrl-respawnTime').classList.toggle('hidden',
    mode !== 'hunt' || !State.config.ghostRespawn);
  // Hud hunt counter solo en hunt
  document.getElementById('hudHuntWrap').style.display = (mode === 'hunt') ? '' : 'none';
  document.getElementById('hudVulnWrap').style.display = (mode === 'classic') ? '' : 'none';
  // Ghost selector solo en hunter
  document.getElementById('ghostSelector').style.display = (mode === 'hunter') ? '' : 'none';
  // Help text
  const help = document.getElementById('helpText');
  if (mode === 'hunter') {
    help.textContent = 'Selecciona un fantasma y muévelo con las flechas. Atrapa a Pac-Man.';
  } else if (mode === 'hunt') {
    help.textContent = 'Cómete a todos los fantasmas (todos son vulnerables).';
  } else {
    help.textContent = 'Usa las flechas ← ↑ → ↓ para mover Pac-Man.';
  }
  renderGhostSelector();
}

function renderGhostSelector() {
  const wrap = document.getElementById('ghostSelector');
  wrap.innerHTML = '';
  if (State.config.gameMode !== 'hunter') return;
  const colors = ['#ff3b3b', '#ffb8de', '#4ad8ff', '#ffb454', '#a0ffa0', '#d28cff'];
  for (let i = 0; i < State.config.ghostCount; i++) {
    const btn = document.createElement('button');
    btn.className = 'ghost-btn' + (i === State.selectedGhostId ? ' selected' : '');
    btn.style.color = colors[i];
    btn.textContent = '👻';
    btn.title = 'Fantasma ' + (i + 1);
    btn.addEventListener('click', () => selectGhost(i));
    wrap.appendChild(btn);
  }
}

function selectGhost(i) {
  if (i < 0 || i >= State.config.ghostCount) return;
  State.selectedGhostId = i;
  renderGhostSelector();
}

// Update ghost selector when ghost count changes
document.getElementById('ghostCount').addEventListener('input', () => {
  if (State.selectedGhostId >= State.config.ghostCount) {
    State.selectedGhostId = 0;
  }
  renderGhostSelector();
});

document.getElementById('btnStart').addEventListener('click', startGame);
document.getElementById('btnPause').addEventListener('click', togglePause);
document.getElementById('btnReset').addEventListener('click', resetGame);

// Mobile controls toggle
const btnMobile = document.getElementById('btnMobile');
const dpadEl = document.getElementById('dpad');
btnMobile.addEventListener('click', () => {
  State.mobile = !State.mobile;
  dpadEl.classList.toggle('active', State.mobile);
  btnMobile.textContent = 'Controles Móviles: ' + (State.mobile ? 'ON' : 'OFF');
});

// Auto-enable mobile controls on touch devices on first visit
if (window.matchMedia('(pointer: coarse)').matches) {
  State.mobile = true;
  dpadEl.classList.add('active');
  btnMobile.textContent = 'Controles Móviles: ON';
}

// D-pad event handlers (touch + mouse)
const DIR_BY_NAME = { up: DIRS.up, down: DIRS.down, left: DIRS.left, right: DIRS.right };
document.querySelectorAll('.dpad-btn[data-dir]').forEach(btn => {
  const name = btn.dataset.dir;
  const d = DIR_BY_NAME[name];
  const press = e => {
    e.preventDefault();
    applyInputDir(d);
    btn.classList.add('pressed');
  };
  const release = () => btn.classList.remove('pressed');
  btn.addEventListener('touchstart', press, { passive: false });
  btn.addEventListener('touchend', release);
  btn.addEventListener('touchcancel', release);
  btn.addEventListener('mousedown', press);
  btn.addEventListener('mouseup', release);
  btn.addEventListener('mouseleave', release);
});

function startGame() {
  State.score = 0;
  State.lives = 3;
  State.level = 1;
  State.pelletProgress = 0;
  State.vulnTimer = 0;
  State.huntCount = 0;
  State._bonusGiven = false;
  State.message = '';
  State.messageTimer = 0;
  if (State.selectedGhostId >= State.config.ghostCount) State.selectedGhostId = 0;
  buildLevel();
  State.running = true;
  State.paused = false;
}
function togglePause() {
  if (!State.running) return;
  State.paused = !State.paused;
}
function resetGame() {
  State.running = false;
  State.paused = false;
  State.score = 0;
  State.lives = 3;
  State.level = 1;
  State.huntCount = 0;
  State.message = '';
  buildLevel();
}

// Initial empty maze for visualization
buildLevel();
syncModeUI();
State.running = false;
requestAnimationFrame(loop);

</script>
</body>
</html>
